name: Refresh Humble feeds

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}        # manual "Run workflow" button

# no `push` trigger: the job commits the .xml files back, which would otherwise re-trigger itself

permissions:
  contents: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python humble_feed.py --out .
      - name: Commit updated feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books.xml games.xml software.xml
          git diff --cached --quiet || git commit -m "chore: refresh feeds"
          git push
